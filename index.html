<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播弹幕</title>
    <link rel="stylesheet" href="index.css">
</head>
<body style="min-width: 350px;">
    <h1>直播弹幕插件</h1>
    <p>这是一个用于直播平台的弹幕插件，可以在直播页面上显示观众发送的弹幕消息。</p>
    <h2>功能特点</h2>
    <ul>
        <li>实时显示观众发送的弹幕消息</li>
        <li>支持自定义弹幕样式和位置</li>
        <li>可以过滤掉不适当的内容</li>
</body>
</html>
